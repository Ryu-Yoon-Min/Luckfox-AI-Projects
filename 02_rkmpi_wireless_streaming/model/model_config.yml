models:
    name: yolov5s_relu           # 모델 출력 이름
    platform: onnx               # 원본 모델이 사용하는 프레임워크
    model_file_path: ./yolov5s_relu.onnx #원본 모델 파일 경로
    quantize: true               # 양자화
    dataset: ./dataset.txt       # 양자화 캘리브레이션용 데이터셋 파일 경로
    configs:
      quantized_dtype: asymmetric_quantized-8 # 양자화 데이터 타입
      mean_values: [0, 0, 0]       # rknn.config의 정규화 평균값
      std_values: [255, 255, 255]  # rknn.config의 정규화 표준편차값
      quant_img_RGB2BGR: false     # 이미지 RGB to BGR 변환 안 함
      quantized_algorithm: normal  # 양자화 알고리즘
      quantized_method: channel    # 양자화 방법 (채널별 양자화)
